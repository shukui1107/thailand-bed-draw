<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泰國床位抽籤</title>
<style>
  :root { --bg:#0d2b33; --bg2:#12404b; --gold:#f4c95d; --cream:#fff6e0; --card:#173f4a; --line:#2c6070; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:"Microsoft JhengHei","PingFang TC",sans-serif; color:var(--cream);
    background: radial-gradient(1200px 600px at 50% -10%, #1d6272 0%, var(--bg) 60%); padding:28px 16px 60px; }
  header { text-align:center; margin-bottom:22px; }
  header h1 { font-size:34px; margin:0; letter-spacing:6px; color:var(--gold); text-shadow:0 2px 12px rgba(244,201,93,.35); }
  header p { margin:6px 0 0; opacity:.75; letter-spacing:2px; }
  .wrap { max-width:1000px; margin:0 auto; }
  .people { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:0 0 16px; }
  .chip { background:var(--bg2); border:1px solid var(--line); padding:5px 14px; border-radius:20px; font-size:15px; }
  details { max-width:520px; margin:0 auto 14px; font-size:14px; opacity:.9; }
  summary { cursor:pointer; text-align:center; }
  textarea { width:100%; height:100px; margin-top:8px; background:#0a2128; color:var(--cream); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:15px; font-family:inherit; }
  .controls { text-align:center; margin:10px 0 26px; }
  button.go { font-size:18px; letter-spacing:3px; padding:12px 38px; border:none; border-radius:40px; cursor:pointer; font-family:inherit; font-weight:bold;
    color:#3a2600; background:linear-gradient(180deg,#ffe08a,#f0b83a); box-shadow:0 5px 0 #b9851c, 0 10px 20px rgba(0,0,0,.35); transition:transform .1s, box-shadow .1s; }
  button.go:hover { transform:translateY(-2px); }
  button.go:active { transform:translateY(4px); box-shadow:0 1px 0 #b9851c; }
  button.go:disabled { filter:grayscale(.7); cursor:default; transform:none; }
  button.go.small { font-size:15px; padding:9px 26px; letter-spacing:2px; }
  button.mute { background:none; border:1px solid var(--line); color:var(--cream); border-radius:20px; padding:6px 14px; margin-left:12px; cursor:pointer; font-family:inherit; }
  .warn { color:#ff9c9c; min-height:22px; margin-top:8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start; }
  @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
  .lodge { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 14px 36px rgba(0,0,0,.35); }
  .photo { height:190px; background-size:cover; background-position:center; position:relative; }
  .photo::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(8,30,36,.92)); }
  .photo h2 { position:absolute; left:16px; bottom:10px; z-index:1; margin:0; font-size:20px; text-shadow:0 2px 8px #000; }
  .photo small { display:block; font-size:12px; opacity:.85; font-weight:normal; margin-bottom:2px; color:var(--gold); letter-spacing:2px; }
  .beds { padding:14px; display:flex; flex-direction:column; gap:10px; }
  .bed { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#0f313b; border:1px dashed var(--line); border-radius:12px; padding:10px 14px; min-height:64px; transition:.3s; }
  .bed .type { font-size:13px; opacity:.85; white-space:nowrap; }
  .bed .type b { display:block; font-size:16px; color:var(--cream); }
  .seats { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .seat { position:relative; height:34px; line-height:34px; font-size:22px; font-weight:bold; min-width:110px; text-align:right; color:#7fa3ad; transition:color .2s; }
  .seat.rolling { color:transparent; text-shadow:none; }
  .reel { position:absolute; right:-8px; top:-31px; width:150px; height:96px; overflow:hidden; z-index:5; border-radius:12px;
    background:#0a252d; border:1px solid var(--gold); box-shadow:0 8px 24px rgba(0,0,0,.55), 0 0 22px rgba(244,201,93,.35);
    -webkit-mask-image:linear-gradient(transparent 0,#000 28%,#000 72%,transparent 100%); mask-image:linear-gradient(transparent 0,#000 28%,#000 72%,transparent 100%); }
  .reel .strip { will-change:transform; }
  .reel .strip div { height:32px; line-height:32px; text-align:center; font-size:20px; color:#9fc3cc; opacity:.75; }
  .reel::after { content:""; position:absolute; left:0; right:0; top:32px; height:32px; background:rgba(244,201,93,.14); border-top:1px solid var(--gold); border-bottom:1px solid var(--gold); }
  .seat.spin { color:var(--gold); text-shadow:0 0 10px rgba(244,201,93,.6); }
  .seat.done { color:#fff; animation:pop .6s; }
  .tag { display:inline-block; padding:0 14px; line-height:30px; border-radius:16px; font-size:20px; color:#0d2b33; box-shadow:0 2px 8px rgba(0,0,0,.35); }
  .seat.snap .tag { animation:slidein .5s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes slidein { from{ opacity:0; transform:translateX(40px) scale(.8); } to{ opacity:1; transform:none; } }
  .chip { border-left-width:10px; }
  .bed.active { border-color:var(--gold); border-style:solid; box-shadow:0 0 18px rgba(244,201,93,.3); }
  .bed.filled { border-style:solid; border-color:#c9a64a; background:linear-gradient(90deg,#10343e,#2b4a3a); }
  @keyframes pop { 0%{transform:scale(1)} 35%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .foot { padding:2px 14px 16px; text-align:center; }
  canvas#fx { position:fixed; inset:0; pointer-events:none; z-index:10; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header>
    <h1>泰國床位抽籤</h1>
    <p>BANGKOK TRIP · BED DRAW</p>
  </header>

  <div class="people" id="people"></div>

  <details>
    <summary>修改名單</summary>
    <textarea id="names">林翊文
王傳渝
陳家森
陳書逵
潘俊喆
蘇愷</textarea>
  </details>

  <div class="controls">
    <button class="go" id="all">兩晚一起抽</button><button class="mute" id="mute">音效：開</button>
    <div class="warn" id="warn"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

const $ = id => document.getElementById(id);
let busy = false, soundOn = true, actx = null;

/* ---------- 畫面 ---------- */
function getPeople(){ return $("names").value.split(/[\n,，、]+/).map(s=>s.trim()).filter(Boolean); }
// 每個人一個固定顏色（依名單順序）
const PALETTE = ["#ff8a80","#ffd54f","#7fdc9b","#6ec6ff","#b794f6","#ffa15c","#f78fb3","#4dd0c4","#c6e05a","#a8b8d8"];
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colorOf = n => PALETTE[Math.max(0,getPeople().indexOf(n)) % PALETTE.length];
const tagHtml = n => `<span class="tag" style="background:${colorOf(n)}">${esc(n)}</span>`;
function renderPeople(){ $("people").innerHTML = getPeople().map(p=>`<span class="chip" style="border-left-color:${colorOf(p)}">${esc(p)}</span>`).join(""); }
function renderLodge(li){
  const l = lodgings[li];
  $("lodge-"+li).querySelector(".beds").innerHTML = l.beds.map((b,bi)=>`
    <div class="bed" id="bed-${li}-${bi}">
      <div class="type"><b>${b.t}</b>${b.cap} 人</div>
      <div class="seats">${Array.from({length:b.cap},(_,k)=>`<div class="seat" id="seat-${li}-${bi}-${k}">？</div>`).join("")}</div>
    </div>`).join("");
}
function renderAll(){
  $("grid").innerHTML = lodgings.map((l,li)=>`
    <div class="lodge" id="lodge-${li}">
      <div class="photo" style="background-image:url('${l.img}')"><h2><small>${l.tag}</small>${l.name}</h2></div>
      <div class="beds"></div>
      <div class="foot"><button class="go small" data-l="${li}">抽這一晚</button></div>
    </div>`).join("");
  lodgings.forEach((_,li)=>renderLodge(li));
  document.querySelectorAll("button[data-l]").forEach(b=>b.onclick=()=>drawLodge(+b.dataset.l));
}
renderAll(); renderPeople();
$("names").addEventListener("input", renderPeople);

/* ---------- 音效（WebAudio，不需音檔） ---------- */
function tone(freq, dur=.12, type="sine", vol=.15, delay=0){
  if(!soundOn||!actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
}
const tick = () => tone(700+Math.random()*200, .04, "square", .05);
const ding = () => { tone(784,.25,"triangle",.2); tone(1175,.4,"sine",.18,.09); };
const fanfare = () => [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.28,"triangle",.2,i*.13));
$("mute").onclick = () => { soundOn=!soundOn; $("mute").textContent = "音效：" + (soundOn?"開":"關"); };

/* ---------- 彩帶 ---------- */
const cv = $("fx"), cx = cv.getContext("2d"); let parts = [], raf = 0;
function resize(){ cv.width = innerWidth; cv.height = innerHeight; } resize(); addEventListener("resize", resize);
function burst(x, y, n=60){
  const cols = ["#f4c95d","#ff7a6b","#6fd3c4","#ffffff","#9ad0ff"];
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 3+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,w:5+Math.random()*5,h:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:90+Math.random()*40});
  }
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p=>p.life>0);
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.25; p.vx*=.99; p.r+=p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha=Math.min(1,p.life/30); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); });
  raf = parts.length ? requestAnimationFrame(loop) : 0;
}

/* ---------- 抽籤 ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const b=new Uint32Array(1); crypto.getRandomValues(b); const j=b[0]%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function spin(seat, bed, pool, winner){
  bed.classList.add("active"); seat.classList.add("spin","rolling");
  // 跑馬燈：垂直捲動的名字條，停在中間那一格
  const N = 26, H = 32, items = [];
  for(let i=0;i<N;i++){
    let n; do { n = pool[Math.floor(Math.random()*pool.length)]; } while(pool.length>1 && n===items[i-1]);
    items.push(n);
  }
  items[N-2] = winner;
  if(pool.length>1){
    const other = pool.find(p=>p!==winner);
    if(items[N-3]===winner) items[N-3]=other;
    if(items[N-1]===winner) items[N-1]=other;
  }
  const reel = document.createElement("div"); reel.className = "reel";
  const strip = document.createElement("div"); strip.className = "strip";
  strip.innerHTML = items.map(n=>`<div style="color:${colorOf(n)}">${esc(n)}</div>`).join("");
  reel.appendChild(strip); seat.appendChild(reel);
  const total = N-3, dur = 4200 + Math.random()*800, t0 = performance.now();
  let last = -1;
  await new Promise(res=>{
    function f(now){
      const t = Math.min(1,(now-t0)/dur), off = (1-Math.pow(1-t,4))*total;   // 先快後慢
      strip.style.transform = `translateY(${-off*H}px)`;
      const idx = Math.floor(off); if(idx!==last){ last=idx; tick(); }
      t<1 ? requestAnimationFrame(f) : res();
    }
    requestAnimationFrame(f);
  });
  await sleep(250);
  seat.innerHTML = tagHtml(winner);
  seat.classList.remove("spin","rolling"); seat.classList.add("done");
  ding();
  const r = seat.getBoundingClientRect(); burst(r.right-30, r.top+r.height/2, 35);
  await sleep(450);
}

// 最後一人：直接滑入，不跑跑馬燈
async function settle(seat, bed, winner){
  bed.classList.add("active");
  seat.classList.add("done","snap");
  seat.innerHTML = tagHtml(winner);
  ding();
  const r = seat.getBoundingClientRect(); burst(r.right-30, r.top+r.height/2, 20);
  await sleep(800);
}

// 回傳 true 表示成功抽完
async function runLodge(li){
  const people = getPeople(), warn = $("warn"); warn.textContent = "";
  const slots = [];
  lodgings[li].beds.forEach((b,bi)=>{ for(let k=0;k<b.cap;k++) slots.push([bi,k]); });
  if(!people.length){ warn.textContent="請先輸入名字。"; return false; }
  if(people.length>slots.length){ warn.textContent=`人數 ${people.length} 比 ${lodgings[li].tag}的床位 ${slots.length} 多，請調整名單。`; return false; }

  renderLodge(li);
  // 先用 crypto 決定結果，動畫只是演出
  const order = shuffle(people);
  const chosen = shuffle(slots).slice(0, people.length).map(s=>s.join("-"));
  const result = {}; chosen.forEach((k,i)=>result[k]=order[i]);

  const used = [];
  for(let bi=0; bi<lodgings[li].beds.length; bi++){
    const bed = $(`bed-${li}-${bi}`);
    for(let k=0;k<lodgings[li].beds[bi].cap;k++){
      const seat = $(`seat-${li}-${bi}-${k}`), who = result[`${bi}-${k}`];
      if(who){
        const left = people.filter(p=>!used.includes(p));
        if(left.length===1) await settle(seat, bed, who);   // 只剩最後一人：不用跑抽籤
        else await spin(seat, bed, left, who);
        used.push(who);
      }
      else { seat.textContent = "空著"; seat.classList.add("done"); }
    }
    bed.classList.remove("active"); bed.classList.add("filled");
  }
  return true;
}

function lock(on, label){
  busy = on;
  $("all").disabled = on;
  document.querySelectorAll("button[data-l]").forEach(b=>b.disabled=on);
  if(!on) $("all").textContent = "兩晚一起抽";
}
function finish(){
  fanfare();
  for(let i=0;i<5;i++) setTimeout(()=>burst(Math.random()*innerWidth, innerHeight*0.25, 50), i*220);
}
function initAudio(){
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==="suspended") actx.resume();
}

async function drawLodge(li){
  if(busy) return; initAudio(); lock(true);
  if(await runLodge(li)) finish();
  lock(false);
}
async function drawAll(){
  if(busy) return; initAudio(); lock(true);
  let ok = true;
  for(let li=0; li<lodgings.length && ok; li++) ok = await runLodge(li);
  if(ok) finish();
  lock(false);
}
$("all").onclick = drawAll;
</script>
