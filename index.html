<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行床位抽籤</title>
<style>
  :root { --paper:#f4ecd8; --card:#fffaf0; --ink:#1c2541; --red:#e4572e; --yellow:#ffc233; --mute:#5f647d; }
  * { box-sizing:border-box; }
  html { overflow-x:hidden; }
  body { margin:0; padding:28px 16px 96px; overflow-x:hidden; color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    background:var(--paper) radial-gradient(rgba(28,37,65,.14) 1px, transparent 1.5px) 0 0/20px 20px; }
  #cam { overflow:clip; margin:-28px -16px -96px; padding:28px 16px 96px; }
  .stage { max-width:1040px; margin:0 auto; }
  body.busy .ledit, body.busy #addLodge, body.busy #reset, body.busy #clear { pointer-events:none; opacity:.5; }

  /* 標題 */
  .top { display:flex; align-items:center; gap:16px; margin-bottom:22px; }
  .stamp { flex:none; width:64px; height:64px; display:grid; place-items:center; border:3px dashed var(--red); border-radius:50%;
    color:var(--red); font-weight:900; letter-spacing:1px; transform:rotate(-10deg); }
  h1 { margin:0; font-size:clamp(30px,6vw,46px); font-weight:900; line-height:1.1; }
  .sub { margin:4px 0 0; color:var(--mute); }

  /* 旅伴 */
  .roster-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px; margin-bottom:10px; }
  .roster-head b { font-size:17px; }
  details summary { cursor:pointer; font-weight:700; border:2px solid var(--ink); border-radius:999px; padding:3px 14px; background:var(--card); list-style:none; display:inline-block; }
  details summary::-webkit-details-marker { display:none; }
  details[open] summary { background:var(--yellow); }
  .editor { margin-top:10px; }
  textarea { width:100%; min-height:130px; padding:10px; font:inherit; color:var(--ink); background:var(--card); border:2px solid var(--ink); border-radius:10px; }
  .hint { margin:6px 0 0; font-size:13px; color:var(--mute); }
  .people { display:flex; flex-wrap:wrap; gap:8px; min-height:40px; }
  .chip { display:inline-flex; align-items:center; gap:8px; max-width:100%; padding:6px 14px 6px 10px; border:2px solid var(--ink); border-radius:10px; font-weight:700; unicode-bidi:plaintext; }
  .chip::before { content:""; flex:none; width:8px; height:8px; border-radius:50%; background:var(--paper); border:2px solid var(--ink); }
  .chip span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .none { color:var(--mute); margin:8px 0; }

  /* 控制列 */
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:20px 0 6px; }
  button { font:inherit; color:var(--ink); }
  button.go { font-size:18px; font-weight:900; letter-spacing:2px; padding:12px 30px; cursor:pointer; background:var(--yellow);
    border:2px solid var(--ink); border-radius:12px; box-shadow:4px 4px 0 var(--ink); transition:transform .08s, box-shadow .08s; }
  button.go:hover { transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink); }
  button.go:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  button.go:disabled { opacity:.5; cursor:default; transform:none; box-shadow:4px 4px 0 var(--ink); }
  button.go.small { font-size:15px; padding:8px 20px; background:var(--paper); box-shadow:3px 3px 0 var(--ink); }
  button.go.small:hover { background:var(--yellow); }
  button.mute, button.mini { cursor:pointer; padding:8px 16px; font-weight:700; background:transparent; border:2px solid var(--ink); border-radius:12px; }
  button.mini { padding:4px 12px; font-size:14px; background:var(--paper); border-radius:999px; }
  button.mini:hover { background:var(--yellow); }
  button.mini.danger { border-color:#b3261e; color:#b3261e; }
  label.fast { display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-weight:700; }
  .warn { min-height:26px; margin:6px 0 20px; color:#b3261e; font-weight:700; }

  /* 住宿卡 */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:26px; align-items:start; }
  @media (max-width:820px){ .grid { grid-template-columns:1fr; } }
  .lodge { --accent:var(--yellow); position:relative; background:var(--card); border:2px solid var(--ink); border-top:12px solid var(--accent); border-radius:16px; box-shadow:6px 6px 0 var(--ink); }
  .lodge:nth-child(4n+2) { --accent:#ff8a80; }
  .lodge:nth-child(4n+3) { --accent:#6ec6ff; }
  .lodge:nth-child(4n+4) { --accent:#7fdc9b; }
  .lhead { display:flex; align-items:flex-start; gap:10px; padding:14px 16px 4px; }
  .badge { flex:none; margin-top:2px; padding:2px 10px; background:var(--accent); border:2px solid var(--ink); font-size:13px; font-weight:900; letter-spacing:1px; transform:rotate(-4deg); white-space:nowrap; }
  .lname { margin:0; min-width:0; font-size:20px; font-weight:900; line-height:1.3; overflow-wrap:anywhere; }
  .lsum { padding:0 16px 8px; font-size:14px; color:var(--mute); }
  .lsum.bad { color:#b3261e; font-weight:700; }
  .ledit { padding:0 16px 8px; }
  .editbody { margin-top:10px; padding:12px; background:#fff; border:2px solid var(--ink); border-radius:12px; }
  .editbody label { display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:14px; }
  .frow { display:flex; flex-wrap:wrap; gap:10px 16px; margin-bottom:10px; }
  input[type=text], input[type=number] { font:inherit; color:var(--ink); background:var(--card); border:2px solid var(--ink); border-radius:8px; padding:5px 8px; min-width:0; }
  input.wname { width:min(100%,260px); }
  input[type=number] { width:62px; }
  .brow { display:grid; grid-template-columns:minmax(0,1fr) auto auto auto; gap:6px 8px; align-items:center; margin:6px 0; }
  .brow input.bname { width:100%; }
  .addbtns { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
  @media (max-width:480px){ .brow { grid-template-columns:1fr 1fr auto; } .brow input.bname { grid-column:1 / -1; } }

  .nightbox { padding:0 16px; }
  .nightbox h3 { margin:10px 0 0; padding-top:10px; font-size:15px; border-top:2px solid var(--ink); }
  .bed { display:grid; grid-template-columns:minmax(96px,auto) minmax(0,1fr); gap:12px; align-items:center; padding:12px 0; border-top:2px dashed rgba(28,37,65,.35); transition:background .2s; }
  .nightbox h3 + div .bed:first-child { border-top:none; }
  .type { display:flex; align-items:center; gap:8px; min-width:0; }
  .type svg { flex:none; }
  .type b { display:block; font-size:15px; line-height:1.2; overflow-wrap:anywhere; }
  .type small { color:var(--mute); font-size:13px; }
  .seats { display:flex; flex-direction:column; align-items:flex-end; gap:6px; min-width:0; }
  .seat { position:relative; display:flex; justify-content:flex-end; width:100%; min-height:38px; min-width:0; }
  .ph { display:grid; place-items:center; min-width:120px; height:38px; padding:0 12px; color:#8d90a4; font-weight:700;
    border:2px dashed rgba(28,37,65,.4); border-radius:10px; }
  .seat.rolling .ph { visibility:hidden; }
  .tag { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; max-width:100%; min-height:38px; padding:5px 14px; line-height:1.25; font-size:18px; font-weight:800; color:var(--ink);
    border:2px solid var(--ink); border-radius:10px; overflow:hidden; overflow-wrap:anywhere; unicode-bidi:plaintext; }
  @media (max-width:480px){
    .bed { grid-template-columns:1fr; gap:8px; }
    .seats { align-items:stretch; }
    .seat { justify-content:flex-start; }
    .tag { font-size:16px; }
  }
  .seat.done .tag { animation:pop .5s; }
  .seat.snap .tag { animation:slidein .5s cubic-bezier(.2,.9,.3,1.2); }
  .bed.active { background:linear-gradient(90deg,rgba(255,194,51,.28),rgba(255,194,51,0)); }
  .bed.active .type b { color:var(--red); }
  @keyframes pop { 0%{transform:scale(.7)} 55%{transform:scale(1.1)} 100%{transform:scale(1)} }
  @keyframes slidein { from{opacity:0;transform:translateX(40px) scale(.85)} to{opacity:1;transform:none} }
  .foot { margin-top:6px; padding:12px 16px 18px; border-top:2px solid var(--ink); text-align:center; }
  .addwrap { margin-top:26px; text-align:center; }

  /* 跑馬燈 */
  .reel { position:absolute; right:-6px; top:-29px; z-index:5; width:230px; max-width:calc(100vw - 40px); height:96px; overflow:hidden;
    background:var(--ink); border:2px solid var(--yellow); border-radius:12px; box-shadow:0 10px 24px rgba(0,0,0,.4);
    -webkit-mask-image:linear-gradient(transparent 0,#000 28%,#000 72%,transparent 100%); mask-image:linear-gradient(transparent 0,#000 28%,#000 72%,transparent 100%); }
  .reel .strip { will-change:transform; }
  .reel .strip div { height:32px; line-height:32px; padding:0 14px; text-align:center; font-size:19px; font-weight:700; opacity:.85;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; unicode-bidi:plaintext; }
  .reel::after { content:""; position:absolute; left:0; right:0; top:32px; height:32px; background:rgba(255,194,51,.16); border-top:2px solid var(--yellow); border-bottom:2px solid var(--yellow); }

  canvas#fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:10; }

  /* 開發用資料切換（只有網址帶 ?data= 或 ?dev 才會出現） */
  #dev { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:20; display:flex; gap:2px; max-width:calc(100vw - 16px); overflow-x:auto;
    padding:3px; background:#d9d9de; border-radius:999px; font:12px system-ui,sans-serif; }
  #dev button { flex:none; border:0; background:transparent; color:#333; padding:5px 12px; border-radius:999px; cursor:pointer; font:inherit; white-space:nowrap; }
  #dev button.on { background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="cam"><div class="stage" id="stage">
  <header class="top">
    <div class="stamp">BED</div>
    <div>
      <h1>旅行床位抽籤</h1>
      <p class="sub">輸入旅伴、設定住宿與床位，誰睡哪張交給命運</p>
    </div>
  </header>

  <section>
    <div class="roster-head">
      <b id="count"></b>
      <details>
        <summary>修改名單</summary>
        <div class="editor">
          <textarea id="names" aria-label="名單，一行一個名字"></textarea>
          <p class="hint">一行一個名字（也可以用逗號、頓號分開）。名字重複會自動加上 2、3，每個名字最多 30 字。</p>
        </div>
      </details>
    </div>
    <div class="people" id="people"></div>
  </section>

  <div class="controls">
    <button class="go" id="all">全部住宿一起抽</button>
    <button class="mute" id="mute">音效：開</button>
    <label class="fast"><input type="checkbox" id="fast"> 快速模式（不跑動畫）</label>
    <button class="mini" id="clear">重設結果</button>
    <button class="mini" id="reset">還原預設設定</button>
  </div>
  <div class="warn" id="warn" role="alert"></div>

  <div class="grid" id="grid"></div>
  <div class="addwrap"><button class="mini" id="addLodge">＋ 新增住宿</button></div>
</div></div>
<div id="dev" hidden></div>

<script>
const DEFAULT_NAMES = ["苗栗小五郎","玫瑰捅你眼","習禁評","高希櫻娜","打給蜜蜂"];
const MAX_LODGINGS = 8;
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const DEV = params.has("data") || params.has("dev");     // 測試模式：不讀寫已儲存的設定
let busy = false, soundOn = true, actx = null;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- 資料 ---------- */
const bedName = cap => ({1:"單人床",2:"雙人床",3:"三人床",4:"四人床"})[cap] || `${cap}人床`;
const mkBed = (cap, count=1) => ({ t:bedName(cap), cap, count });
const defaultLodgings = () => [
  { name:"住宿一", nights:1, beds:[mkBed(2,2), mkBed(1,1)] },
  { name:"住宿二", nights:1, beds:[mkBed(3,1), mkBed(2,1)] },
];
const clampInt = (v, min, max, def) => { const n = parseInt(v,10); return isNaN(n) ? def : Math.min(max, Math.max(min, n)); };
function cleanLodging(l, i){
  l = l && typeof l === "object" ? l : {};
  const beds = (Array.isArray(l.beds) ? l.beds : []).slice(0,12).map(b=>{
    const cap = clampInt(b && b.cap, 1, 10, 2);
    return { t:String((b && b.t) || bedName(cap)).slice(0,12), cap, count:clampInt(b && b.count, 1, 20, 1) };
  });
  return { name:String(l.name || `住宿 ${i+1}`).slice(0,40), nights:clampInt(l.nights, 1, 14, 1), beds };
}

let lodgings = defaultLodgings(), fast = false, namesText = DEFAULT_NAMES.join("\n");
function load(){
  if(DEV) return;
  try {
    const s = JSON.parse(localStorage.getItem("bedDraw.v1") || "null");
    if(!s) return;
    if(typeof s.names === "string") namesText = s.names;
    if(Array.isArray(s.lodgings) && s.lodgings.length) lodgings = s.lodgings.slice(0,MAX_LODGINGS).map(cleanLodging);
  } catch(e) {}
}
function save(){
  if(DEV) return;
  try { localStorage.setItem("bedDraw.v1", JSON.stringify({ names:$("names").value, lodgings })); } catch(e) {}
}
load();
$("names").value = namesText; $("fast").checked = fast;

const expand = l => { const out=[]; l.beds.forEach(b=>{ for(let c=1;c<=b.count;c++) out.push({ t:b.t, cap:b.cap, n:b.count>1?c:0 }); }); return out; };
const capacity = l => l.beds.reduce((s,b)=>s+b.cap*b.count, 0);

/* ---------- 名單 ---------- */
let cacheKey = null, cacheVal = [];
function getPeople(){
  const raw = $("names").value;
  if(raw === cacheKey) return cacheVal;
  const seen = {};
  cacheVal = raw.split(/[\n,，、]+/).map(s=>Array.from(s.trim()).slice(0,30).join("")).filter(Boolean).map(n=>{
    seen[n] = (seen[n]||0)+1;
    return seen[n]>1 ? `${n} ${seen[n]}` : n;
  });
  cacheKey = raw; return cacheVal;
}
const PALETTE = ["#ff8a80","#ffd54f","#7fdc9b","#6ec6ff","#b794f6","#ffa15c","#f78fb3","#4dd0c4","#c6e05a","#a8b8d8"];
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colorOf = n => PALETTE[Math.max(0,getPeople().indexOf(n)) % PALETTE.length];
const tagHtml = n => `<span class="tag" title="${esc(n)}" style="background:${colorOf(n)}">${esc(n)}</span>`;

function renderPeople(){
  const p = getPeople();
  $("count").textContent = p.length ? `旅伴 ${p.length} 人` : "旅伴";
  $("people").innerHTML = p.length
    ? p.map(n=>`<span class="chip" title="${esc(n)}" style="background:${colorOf(n)}"><span>${esc(n)}</span></span>`).join("")
    : '<span class="none">還沒有名字，展開「修改名單」輸入。</span>';
  renderSummaries();
}

/* ---------- 住宿卡 ---------- */
function bedSvg(cap){
  const W = 16 + 14*Math.min(cap,3);
  return `<svg viewBox="0 0 ${W} 22" width="${W}" height="22" aria-hidden="true"><path d="M2 4v16M2 15h${W-4}v5M${W-2} 15v-3a3 3 0 0 0-3-3H12v6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function summaryText(l){
  const cap = capacity(l), n = getPeople().length;
  if(!cap) return { text:"還沒有床位，請在下方編輯新增。", bad:true };
  if(n > cap) return { text:`可睡 ${cap} 人，旅伴有 ${n} 人，床位不夠。`, bad:true };
  return { text:`可睡 ${cap} 人 · 旅伴 ${n} 人${cap>n?` · 空 ${cap-n} 位`:""}`, bad:false };
}
function renderSummaries(){
  lodgings.forEach((l,li)=>{ const el = $("lsum-"+li); if(!el) return; const s = summaryText(l); el.textContent = s.text; el.classList.toggle("bad", s.bad); });
}
function bedRows(li){
  return lodgings[li].beds.map((b,bi)=>`
    <div class="brow" data-b="${bi}">
      <input type="text" class="bname" data-f="t" maxlength="12" value="${esc(b.t)}" aria-label="床的名稱">
      <label>睡 <input type="number" data-f="cap" min="1" max="10" value="${b.cap}"> 人</label>
      <label>× <input type="number" data-f="count" min="1" max="20" value="${b.count}"> 張</label>
      <button class="mini danger" data-act="delbed" aria-label="刪除這個床位">刪除</button>
    </div>`).join("") || '<p class="none">還沒有床位。</p>';
}
function renderNight(li, ni){
  const beds = expand(lodgings[li]);
  $(`night-${li}-${ni}`).innerHTML = beds.map((b,bi)=>`
    <div class="bed" id="bed-${li}-${ni}-${bi}">
      <div class="type">${bedSvg(b.cap)}<div><b>${esc(b.t)}${b.n?` ${b.n}`:""}</b><small>${b.cap} 人</small></div></div>
      <div class="seats">${Array.from({length:b.cap},(_,k)=>`<div class="seat" id="seat-${li}-${ni}-${bi}-${k}"><span class="ph">？</span></div>`).join("")}</div>
    </div>`).join("") || '<p class="none">還沒有床位，展開「編輯住宿與床位」新增。</p>';
}
function renderNights(li){
  const l = lodgings[li];
  $("nights-"+li).innerHTML = Array.from({length:l.nights},(_,ni)=>`
    <section class="nightbox">${l.nights>1?`<h3>第 ${ni+1} 晚</h3>`:""}<div id="night-${li}-${ni}"></div></section>`).join("");
  for(let ni=0; ni<l.nights; ni++) renderNight(li, ni);
}
function refreshLodge(li){            // 不重畫編輯區，避免輸入時失去游標
  const l = lodgings[li];
  $("ltitle-"+li).textContent = l.name || `住宿 ${li+1}`;
  $("lbadge-"+li).textContent = `${l.nights} 晚`;
  renderNights(li); renderSummaries(); save();
}
function renderAll(){
  $("grid").innerHTML = lodgings.map((l,li)=>`
    <div class="lodge" data-li="${li}" id="lodge-${li}">
      <div class="lhead"><span class="badge" id="lbadge-${li}"></span><h2 class="lname" id="ltitle-${li}"></h2></div>
      <div class="lsum" id="lsum-${li}"></div>
      <details class="ledit">
        <summary>編輯住宿與床位</summary>
        <div class="editbody">
          <div class="frow">
            <label>名稱 <input type="text" class="wname" data-lf="name" maxlength="40" value="${esc(l.name)}"></label>
            <label>天數 <input type="number" data-lf="nights" min="1" max="14" value="${l.nights}"> 晚</label>
          </div>
          <div id="brows-${li}">${bedRows(li)}</div>
          <div class="addbtns">
            <button class="mini" data-act="addbed" data-cap="1">＋ 單人床</button>
            <button class="mini" data-act="addbed" data-cap="2">＋ 雙人床</button>
            <button class="mini" data-act="addbed" data-cap="3">＋ 三人床</button>
            <button class="mini" data-act="addbed" data-cap="0">＋ 自訂</button>
          </div>
          ${lodgings.length>1 ? '<button class="mini danger" data-act="dellodge">刪除這間住宿</button>' : ''}
        </div>
      </details>
      <div id="nights-${li}"></div>
      <div class="foot"><button class="go small" data-act="draw">抽這間</button></div>
    </div>`).join("");
  lodgings.forEach((_,li)=>{ $("ltitle-"+li).textContent = lodgings[li].name || `住宿 ${li+1}`; $("lbadge-"+li).textContent = `${lodgings[li].nights} 晚`; renderNights(li); });
  renderSummaries();
  $("addLodge").disabled = lodgings.length >= MAX_LODGINGS;
}

/* 編輯事件（事件委派） */
$("grid").addEventListener("input", e=>{
  const el = e.target; if(busy || !el.closest(".lodge")) return;
  const li = +el.closest(".lodge").dataset.li, l = lodgings[li];
  if(el.dataset.lf === "name"){ l.name = el.value.slice(0,40); }
  else if(el.dataset.lf === "nights"){ const n = parseInt(el.value,10); if(isNaN(n)||n<1||n>14) return; l.nights = n; }
  else if(el.dataset.f){
    const b = l.beds[+el.closest(".brow").dataset.b];
    if(el.dataset.f === "t") b.t = el.value.slice(0,12);
    else { const n = parseInt(el.value,10), max = el.dataset.f==="cap"?10:20; if(isNaN(n)||n<1||n>max) return; b[el.dataset.f] = n; }
  } else return;
  refreshLodge(li);
});
$("grid").addEventListener("change", e=>{            // 離開欄位時把無效數字校正回來
  const el = e.target; if(!el.closest(".lodge")) return;
  const li = +el.closest(".lodge").dataset.li, l = lodgings[li];
  if(el.dataset.lf === "nights") el.value = l.nights;
  else if(el.dataset.f === "cap" || el.dataset.f === "count") el.value = l.beds[+el.closest(".brow").dataset.b][el.dataset.f];
});
$("grid").addEventListener("click", e=>{
  const btn = e.target.closest("button[data-act]"); if(!btn) return;
  const li = +btn.closest(".lodge").dataset.li, l = lodgings[li], act = btn.dataset.act;
  if(act === "draw"){ drawLodge(li); return; }
  if(busy) return;
  if(act === "addbed"){
    if(l.beds.length >= 12) return;
    const cap = +btn.dataset.cap;
    l.beds.push(cap ? mkBed(cap) : { t:"自訂床", cap:2, count:1 });
    $("brows-"+li).innerHTML = bedRows(li); refreshLodge(li);
  } else if(act === "delbed"){
    l.beds.splice(+btn.closest(".brow").dataset.b, 1);
    $("brows-"+li).innerHTML = bedRows(li); refreshLodge(li);
  } else if(act === "dellodge"){
    if(confirm(`刪除「${l.name}」？`)){ lodgings.splice(li,1); renderAll(); save(); }
  }
});
$("addLodge").onclick = () => {
  if(busy || lodgings.length >= MAX_LODGINGS) return;
  lodgings.push({ name:`住宿 ${lodgings.length+1}`, nights:1, beds:[mkBed(2,2), mkBed(1,1)] });
  renderAll(); save();
};
$("clear").onclick = () => {              // 只清掉抽籤結果，名單與住宿設定不動
  if(busy) return;
  lodgings.forEach((_,li)=>renderNights(li)); $("warn").textContent = "";
};
$("reset").onclick = () => {
  if(busy || !confirm("重設名單與所有住宿設定？")) return;
  $("names").value = DEFAULT_NAMES.join("\n"); lodgings = defaultLodgings();
  renderAll(); renderPeople(); $("warn").textContent = ""; save();
};
$("names").addEventListener("input", ()=>{ renderPeople(); save(); });
$("fast").onchange = () => { fast = $("fast").checked; };   // 快速模式每次打開都預設關閉，不儲存
renderAll(); renderPeople();

/* ---------- 音效（WebAudio，不需音檔） ---------- */
function tone(freq, dur=.12, type="sine", vol=.15, delay=0){
  if(!soundOn||!actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
}
const tick = () => tone(700+Math.random()*200, .04, "square", .05);
const ding = () => { tone(784,.25,"triangle",.2); tone(1175,.4,"sine",.18,.09); };
const thud = () => tone(90,.2,"sine",.35);
const fanfare = () => [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.28,"triangle",.2,i*.13));
$("mute").onclick = () => { soundOn=!soundOn; $("mute").textContent = "音效：" + (soundOn?"開":"關"); };

/* ---------- 畫面震動 ---------- */
function shake(px, ms){
  if(reduceMotion) return;
  const n = 12, frames = [];
  for(let i=0;i<n;i++){
    const k = 1 - i/n, r = () => (Math.random()*2-1)*px*k;
    frames.push({ transform:`translate(${r()}px,${r()}px) rotate(${r()*.1}deg)` });
  }
  frames.push({ transform:"none" });
  $("cam").animate(frames, { duration:ms, easing:"linear" });
}

/* ---------- 彩帶 ---------- */
const cv = $("fx"), cx = cv.getContext("2d"); let parts = [], raf = 0;
function resize(){ cv.width = innerWidth; cv.height = innerHeight; } resize(); addEventListener("resize", resize);
function burst(x, y, n=60){
  const cols = ["#ffc233","#e4572e","#2a9d8f","#ffffff","#1c2541"];
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 3+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,w:5+Math.random()*5,h:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:90+Math.random()*40});
  }
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p=>p.life>0);
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.25; p.vx*=.99; p.r+=p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha=Math.min(1,p.life/30); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); });
  raf = parts.length ? requestAnimationFrame(loop) : 0;
}

/* ---------- 抽籤 ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const b=new Uint32Array(1); crypto.getRandomValues(b); const j=b[0]%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* 輪到的位子不在畫面中間時，先捲過去 */
async function bringIntoView(el){
  const r = el.getBoundingClientRect();
  if(r.top > innerHeight*0.2 && r.bottom < innerHeight*0.8) return;
  el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block:"center" });
  await sleep(600);
}

async function spin(seat, bed, pool, winner){
  bed.classList.add("active"); seat.classList.add("rolling");
  await bringIntoView(seat);
  // 跑馬燈：垂直捲動的名字條，停在中間那一格
  const N = 26, H = 32, items = [];
  for(let i=0;i<N;i++){
    let n; do { n = pool[Math.floor(Math.random()*pool.length)]; } while(pool.length>1 && n===items[i-1]);
    items.push(n);
  }
  items[N-2] = winner;
  if(pool.length>1){
    const other = pool.find(p=>p!==winner);
    if(items[N-3]===winner) items[N-3]=other;
    if(items[N-1]===winner) items[N-1]=other;
  }
  const reel = document.createElement("div"); reel.className = "reel";
  const strip = document.createElement("div"); strip.className = "strip";
  strip.innerHTML = items.map(n=>`<div style="color:${colorOf(n)}">${esc(n)}</div>`).join("");
  reel.appendChild(strip); seat.appendChild(reel);
  const total = N-3, dur = 4200 + Math.random()*800, t0 = performance.now();
  let last = -1;
  await new Promise(res=>{
    function f(now){
      const t = Math.min(1,(now-t0)/dur), off = (1-Math.pow(1-t,4))*total;   // 先快後慢
      strip.style.transform = `translateY(${-off*H}px)`;
      const idx = Math.floor(off); if(idx!==last){ last=idx; tick(); }
      t<1 ? requestAnimationFrame(f) : res();
    }
    requestAnimationFrame(f);
  });
  await sleep(250);
  seat.innerHTML = tagHtml(winner);
  seat.classList.remove("rolling"); seat.classList.add("done");
  ding(); thud(); shake(7, 380);
  const r = seat.getBoundingClientRect(); burst(r.right-30, r.top+r.height/2, 35);
  await sleep(450);
}

// 結果已定：直接滑入，不跑跑馬燈
async function settle(seat, bed, winner){
  bed.classList.add("active");
  seat.classList.add("done","snap");
  seat.innerHTML = tagHtml(winner);
  ding(); shake(4, 260);
  const r = seat.getBoundingClientRect(); burst(r.right-30, r.top+r.height/2, 20);
  await sleep(650);
}

// 快速模式：連續填入，只有滴答聲
async function quickFill(seat, winner){
  seat.innerHTML = tagHtml(winner); seat.classList.add("done"); tick();
  await sleep(90);
}

// 回傳 true 表示成功抽完
async function runNight(li, ni){
  const l = lodgings[li], people = getPeople(), warn = $("warn"); warn.textContent = "";
  const beds = expand(l), slots = [];
  beds.forEach((b,bi)=>{ for(let k=0;k<b.cap;k++) slots.push([bi,k]); });
  if(!people.length){ warn.textContent = "請先輸入名字。"; return false; }
  if(!slots.length){ warn.textContent = `「${l.name}」還沒有床位，請先編輯新增。`; return false; }
  if(people.length>slots.length){ warn.textContent = `人數 ${people.length} 比「${l.name}」的床位 ${slots.length} 多，請調整名單或床位。`; return false; }

  renderNight(li, ni);
  // 先用 crypto 決定結果，動畫只是演出
  const order = shuffle(people);
  const chosen = shuffle(slots).slice(0, people.length).map(s=>s.join("-"));
  const result = {}; chosen.forEach((k,i)=>result[k]=order[i]);

  const used = [];
  for(let bi=0; bi<beds.length; bi++){
    const bed = $(`bed-${li}-${ni}-${bi}`);
    for(let k=0;k<beds[bi].cap;k++){
      const seat = $(`seat-${li}-${ni}-${bi}-${k}`), who = result[`${bi}-${k}`];
      if(who){
        const left = people.filter(p=>!used.includes(p));
        let rest = 0;
        for(let kk=k; kk<beds[bi].cap; kk++) if(result[`${bi}-${kk}`]) rest++;
        if(fast) await quickFill(seat, who);
        else if(left.length===rest){ await bringIntoView(seat); await settle(seat, bed, who); }  // 剩下的人全睡這張床：不用抽
        else await spin(seat, bed, left, who);
        used.push(who);
      } else { seat.innerHTML = '<span class="ph">空著</span>'; }
    }
    bed.classList.remove("active");
  }
  return true;
}

function lock(on){
  busy = on;
  document.body.classList.toggle("busy", on);
  $("all").disabled = on;
  document.querySelectorAll("button[data-act=draw]").forEach(b=>b.disabled=on);
}
function finish(){
  fanfare(); shake(16, 800);
  for(let i=0;i<5;i++) setTimeout(()=>burst(Math.random()*innerWidth, innerHeight*0.25, 50), i*220);
}
function initAudio(){
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==="suspended") actx.resume();
}
async function runLodgeAll(li){            // 一間住宿的每一晚各抽一次
  for(let ni=0; ni<lodgings[li].nights; ni++) if(!(await runNight(li, ni))) return false;
  return true;
}
async function drawLodge(li){
  if(busy) return; initAudio(); lock(true);
  if(await runLodgeAll(li)) finish();
  lock(false);
}
async function drawAll(){
  if(busy) return; initAudio(); lock(true);
  let ok = true;
  for(let li=0; li<lodgings.length && ok; li++) ok = await runLodgeAll(li);
  if(ok) finish();
  lock(false);
}
$("all").onclick = drawAll;
